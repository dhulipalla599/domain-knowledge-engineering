name: Build examples

# Builds and tests runnable examples on pull requests that touch them, and
# all examples on demand (Actions -> Build examples -> Run workflow).
# Topic PRs are also built by "Open topic PR"; this covers hand-made PRs.

on:
  pull_request:
    paths:
      - "examples/**"
      - "templates/**"
      - ".github/workflows/examples-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test examples
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            dirs=$(git diff --name-only "$BASE"...HEAD -- examples | cut -d/ -f1-3 | sort -u)
          else
            dirs=$(find examples -mindepth 3 -maxdepth 3 -name pom.xml -printf '%h\n' 2>/dev/null | sort)
          fi
          failed=0
          for d in $dirs; do
            [ -f "$d/pom.xml" ] || continue
            echo "::group::$d"
            if mvn -B -ntp -f "$d/pom.xml" verify | tee /tmp/build.log; [ "${PIPESTATUS[0]}" -eq 0 ]; then
              tests=$(grep -E "^\[INFO\] Tests run:" /tmp/build.log | tail -1 | sed 's/\[INFO\] //')
              echo "✅ $d ($tests)" >> "$GITHUB_STEP_SUMMARY"
              echo "::notice title=Example built::$d - $tests"
            else
              echo "❌ $d" >> "$GITHUB_STEP_SUMMARY"; failed=1
              echo "::error title=Example failed::$d - see the build log"
            fi
            echo "::endgroup::"
          done
          [ -n "$dirs" ] || echo "No examples to build." >> "$GITHUB_STEP_SUMMARY"
          exit $failed
