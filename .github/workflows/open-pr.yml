name: Open topic PR

# The daily routine pushes each new topic to a branch named
#   feature/YYYY-MM-DD--<domain>--<topic>
# This workflow turns that push into a labeled PR, assigns the day's reviewer,
# and checks everything: page sections, diagrams, the site build, and the
# runnable example's Maven build and tests. It re-runs on every new push to
# the branch, so reviewer edits are re-checked too.

on:
  push:
    branches:
      - "feature/[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]--**"

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install tools
        run: |
          pip install -r scripts/requirements.txt
          npm install -g @mermaid-js/mermaid-cli
          if command -v google-chrome >/dev/null; then
            echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          fi

      - name: Find the page in this branch
        id: page
        run: |
          file=$(git diff --name-only --diff-filter=AM origin/main...HEAD -- 'docs/*/*.md' | grep -v -e '/index.md$' -e '^docs/qa/' | head -n1)
          if [ -z "$file" ]; then echo "::error::No new page under docs/ in this branch"; exit 1; fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          python - "$file" >> "$GITHUB_OUTPUT" << 'PY'
          import sys; sys.path.insert(0, "scripts")
          from common import front_matter, load_yaml
          import pathlib
          fm = front_matter(pathlib.Path(sys.argv[1]))
          for key in ("title", "domain", "reviewer", "author", "example"):
              print(f"{key}={str(fm.get(key) or '').strip()}")
          ex = load_yaml("config.yaml").get("examples") or {}
          print(f"java={ex.get('java_version', '21')}")
          PY

      - uses: actions/setup-java@v5
        if: steps.page.outputs.example != ''
        with:
          distribution: temurin
          java-version: ${{ steps.page.outputs.java }}
          cache: maven

      - name: Check page and build the example
        id: check
        continue-on-error: true
        run: python scripts/check_page.py "${{ steps.page.outputs.file }}" --mermaid --build --report /tmp/report.md

      - name: Check commit attribution
        id: attribution
        continue-on-error: true
        run: python scripts/check_attribution.py origin/main..HEAD --report /tmp/attribution.md

      - name: Check the site builds
        id: site
        continue-on-error: true
        run: |
          python scripts/build_catalog.py
          mkdocs build -f mkdocs.gen.yml --site-dir /tmp/site

      - name: Create PR or post results
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          TITLE: ${{ steps.page.outputs.title }}
          DOMAIN: ${{ steps.page.outputs.domain }}
          REVIEWER: ${{ steps.page.outputs.reviewer }}
          AUTHOR: ${{ steps.page.outputs.author }}
          EXAMPLE: ${{ steps.page.outputs.example }}
          CHECK: ${{ steps.check.outcome }}
          SITE: ${{ steps.site.outcome }}
        run: |
          printf '\n' >> /tmp/report.md && cat /tmp/attribution.md >> /tmp/report.md
          gh label create auto-generated --color 5319e7 --description "Daily topic page" --force
          gh label create hold --color d93f0b --description "Stops the 24h auto-merge" --force
          if [ "$SITE" = "failure" ]; then
            printf '\n- ❌ The MkDocs site failed to build with this page (see the workflow log).\n' >> /tmp/report.md
          fi

          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            {
              echo "## $DOMAIN: $TITLE"
              echo
              echo "Author: @$AUTHOR. **Reviewer today: @$REVIEWER** (approve and merge to get credit)."
              echo
              cat /tmp/report.md
              if [ -n "$EXAMPLE" ]; then
                echo
                echo "### Run the example locally"
                echo '```bash'
                echo "git fetch origin $BRANCH && git checkout $BRANCH"
                echo "cd $EXAMPLE && mvn spring-boot:run"
                echo '```'
              fi
              echo
              echo "### Review checklist"
              echo "- [ ] Business explanation is accurate (no invented rules or regulations)"
              echo "- [ ] Use case and UML diagrams match the example code (Files changed → ... → View file)"
              echo "- [ ] The example builds, runs, and the curl calls in its README work"
              echo "- [ ] Added something to **Practitioner Notes**"
              echo
              echo "**To finish:** Approve, then **Merge pull request** using *Create a merge commit*."
              echo "No action within 24 hours → the bot merges it if all checks pass. Add the \`hold\` label or request changes to stop that."
            } > /tmp/body.md
            url=$(gh pr create --base main --head "$BRANCH" --title "$DOMAIN: $TITLE" \
                    --body-file /tmp/body.md --label auto-generated)
            echo "Created $url"
            if [ -n "$REVIEWER" ]; then
              gh pr edit "$url" --add-reviewer "$REVIEWER" --add-assignee "$REVIEWER" \
                || echo "::warning::Could not assign $REVIEWER (has the collaborator invite been accepted?)"
            fi
          else
            gh pr comment "$number" --body-file /tmp/report.md
          fi

      - name: Fail if the page or example has problems
        if: steps.check.outcome == 'failure' || steps.site.outcome == 'failure' || steps.attribution.outcome == 'failure'
        run: |
          echo "::error::Checks failed - see the report in the PR."
          exit 1
