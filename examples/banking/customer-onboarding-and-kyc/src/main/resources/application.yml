spring:
  application:
    name: banking-customer-onboarding-and-kyc
  datasource:
    url: jdbc:h2:mem:banking-customer-onboarding-and-kyc;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console  (JDBC URL above)
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true   # data.sql (if present) runs after tables exist

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
