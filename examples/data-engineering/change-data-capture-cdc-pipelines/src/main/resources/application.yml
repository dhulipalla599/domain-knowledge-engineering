spring:
  application:
    name: data-engineering-change-data-capture-cdc-pipelines
  datasource:
    url: jdbc:h2:mem:data-engineering-change-data-capture-cdc-pipelines;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  h2:
    console:
      enabled: true          # http://localhost:8080/h2-console  (JDBC URL above)
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true   # data.sql (if present) runs after tables exist

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080

cdc:
  schedule:
    enabled: false           # set true to run the pipeline on the cron below
    source: customers-batch-1
    cron: "0 */15 * * * *"
